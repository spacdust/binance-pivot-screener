<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2329"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>

    <!-- Binance Signature Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f0b90b"/>
      <stop offset="100%" stop-color="#fcd535"/>
    </linearGradient>

    <!-- High-Momentum Emerald Breakout Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ecb81"/>
      <stop offset="100%" stop-color="#2ebd85"/>
    </linearGradient>
  </defs>

  <!-- Modern Obsidian Badge -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="27.5" fill="none" stroke="#2b313a" stroke-width="3"/>

  <!-- Horizontal Center Pivot Level P (Screener Horizon) -->
  <line x1="18" y1="64" x2="110" y2="64" stroke="#2b313a" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="64" x2="86" y2="64" stroke="#f0b90b" stroke-width="3.5" stroke-dasharray="5 4" stroke-opacity="0.8"/>

  <!-- Core Geometry: Binance Diamond Frame -->
  <path d="M64 24 L96 56 L64 88 L32 56 Z" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linejoin="round"/>

  <!-- Central Pivot Focal Dot -->
  <circle cx="64" cy="56" r="7" fill="#f0b90b"/>

  <!-- Lower Support Arch (S-Zone Anchor) -->
  <path d="M42 98 L64 78 L86 98" fill="none" stroke="#2b313a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic Breakout Arrow (Crossing P upwards into Resistance) -->
  <path d="M50 44 L80 14" stroke="url(#greenGrad)" stroke-width="9" stroke-linecap="round"/>
  <path d="M64 14 L80 14 L80 30" fill="none" stroke="url(#greenGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
